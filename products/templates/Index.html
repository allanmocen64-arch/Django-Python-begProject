{% extends 'base.html' %}
{% block content %}
<h1>Products</h1>
<div class="row"></div>
{% for product in products %}
<div class="col"></div>
<div class="card" style="width: 18rem;">
    <img src="{{product.image_url}}" class="card-img-top" alt="Card image">

    <div class="card-body">
        <h5 class="card-title">{{product.name}}</h5>

        <p class="card-text">
       ksh {{product.price}}
        </p>

        <a href="#" class="btn btn-primary">Add to Cart</a>
    </div>
    {% endfor %}
</div>

{% endblock %}
